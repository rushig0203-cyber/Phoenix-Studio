name: Phoenix Windows update

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main-branch commit to build for local installation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phoenix-windows-update
  cancel-in-progress: false

jobs:
  verified-windows-build:
    # Standard public-repository runners are free; never use a larger runner.
    if: github.repository == 'rushig0203-cyber/Phoenix-Studio' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PHOENIX_BUILD_DIR: .next-build-gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out only committed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Match the laptop's Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          # No dependency/build cache or billable Actions artifact storage.
      - name: Verify immutable source and platform
        run: |
          if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source revision' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout changed' }
          node -e "if(process.platform!=='win32'||process.arch!=='x64'||process.version!=='v24.19.0')throw Error('Runtime mismatch')"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime verification failed' }
          $privateFiles = @(git ls-files | Where-Object { $_ -match '^(storage/|work/|public/local-videos/|\.env)' })
          if ($privateFiles.Count) { throw 'Private runtime files must never enter a remote build' }
      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run release regressions one file at a time
        run: >-
          node --max-old-space-size=192 --test --test-concurrency=1
          scripts/test-package-phoenix-build.cjs
          scripts/test-install-phoenix-build.cjs
          scripts/test-review-publishing.cjs
          scripts/test-review-publish-ui.cjs
          scripts/test-video-posting-analysis.cjs
          scripts/test-posting-copy-policy.cjs
          scripts/test-reel-music.cjs
          scripts/test-instagram-audio.cjs
          scripts/test-instagram-tags.cjs
          scripts/test-posting-automation.cjs
          scripts/test-posting-actions.cjs
          scripts/test-publish-settings-status.cjs
          scripts/test-stock-reels-ui.cjs
          scripts/test-stock-production-guidance.cjs
          scripts/test-release-refresh.cjs
          scripts/test-launch-release-consistency.cjs
          scripts/test-cloudflare-writer.cjs
          scripts/test-writing-settings.cjs
          scripts/test-groq-writer.cjs
          scripts/test-startup.cjs
          scripts/test-automatic-stock-reel.cjs
          scripts/test-automatic-stock-pool.cjs
          scripts/test-stock-catalog-paging.cjs
          scripts/test-natural-stock-relevance.cjs
          scripts/test-stock-reel-adaptive.cjs
          scripts/test-stock-motion.cjs
          scripts/test-stock-reuse.cjs
          scripts/test-stock-visual-continuity.cjs
          scripts/test-stock-temporary-cleanup.cjs
          scripts/test-job-summary-ui.cjs
          scripts/test-stock-reel-editing.cjs
          scripts/test-stock-reel-quality.cjs
          scripts/test-stock-reel-audio.cjs
          scripts/test-stock-reel-remux.cjs
      - name: Lint changed production interfaces
        run: >-
          npx --no-install eslint
          src/lib/reelMusic.ts src/lib/postingEvidence.ts
          src/lib/videoPostingAnalysis.ts src/lib/postingCopyPolicy.ts
          src/lib/reviewPublishing.ts src/lib/instagramAudio.ts
          src/lib/reviewFiles.ts src/components/ReviewPublishActions.tsx
          src/app/api/review-files/[id]/publish/route.ts
          src/lib/stockReel.ts src/lib/stockMotion.ts src/lib/stockReuse.ts src/lib/stockVisualContinuity.ts src/lib/stockTemporaryCleanup.ts
          src/lib/automaticStockReel.ts src/lib/naturalStock.ts src/lib/sourceProcessing.ts
          src/app/api/stock-reels/route.ts
          src/lib/stockProductionGuidance.ts src/components/StockReels.tsx
          src/lib/cloudflareWriter.ts src/lib/writingSettings.ts
          src/lib/writingModel.ts src/lib/localServiceHealth.ts
          src/components/WritingProviderSettings.tsx src/components/StudioHealth.tsx
          src/app/api/writing-provider/route.ts
          src/app/dashboard/DashboardClient.tsx
      - name: Verify real FFmpeg adaptive editing in an isolated synthetic fixture
        run: node --max-old-space-size=192 scripts/verify-adaptive-stock-render.cjs
      - name: Verify an edited reel from public licensed Pexels footage, no owner files or keys
        env:
          PHOENIX_QUALITY_PROOF_DIR: ${{ runner.temp }}/phoenix-public-quality-${{ github.run_id }}-${{ github.run_attempt }}
        run: node --max-old-space-size=192 scripts/verify-public-stock-quality.cjs
      - name: Compile with existing RAM guard and full TypeScript checks
        run: npm run build
      - name: Package only the verified production bundle
        env:
          PHOENIX_ARTIFACT_DIR: ${{ runner.temp }}/phoenix-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        run: node --max-old-space-size=192 scripts/package-phoenix-build.cjs
      - name: Save temporary unpublished installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          PHOENIX_ARTIFACT_DIR: ${{ runner.temp }}/phoenix-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          PHOENIX_QUALITY_PROOF_DIR: ${{ runner.temp }}/phoenix-public-quality-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $tag = "phoenix-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag "$env:PHOENIX_ARTIFACT_DIR/phoenix-build.tar.gz" "$env:PHOENIX_ARTIFACT_DIR/phoenix-build-manifest.json" "$env:PHOENIX_QUALITY_PROOF_DIR/coherent-reel.mp4" "$env:PHOENIX_QUALITY_PROOF_DIR/after.jpg" "$env:PHOENIX_QUALITY_PROOF_DIR/proof.json" --draft --target $env:GITHUB_SHA --title "Phoenix verified Windows build $env:GITHUB_RUN_ID" --notes "Temporary local-installation bundle and edited public-Pexels quality proof from exact commit $env:GITHUB_SHA. No credentials, owner files, downloaded originals or models are included. This draft is not published."
          if ($LASTEXITCODE -ne 0) { throw 'Could not save the verified installation bundle' }
