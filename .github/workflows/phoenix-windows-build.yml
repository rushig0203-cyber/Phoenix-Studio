name: Phoenix Windows update

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main-branch commit to build for local installation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phoenix-windows-update
  cancel-in-progress: false

jobs:
  verified-windows-build:
    # Standard public-repository runners are free; never use a larger runner.
    if: github.repository == 'rushig0203-cyber/Phoenix-Studio' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PHOENIX_BUILD_DIR: .next-build-gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out only committed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Match the laptop's Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          # No dependency/build cache or billable Actions artifact storage.
      - name: Verify immutable source and platform
        run: |
          if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source revision' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout changed' }
          node -e "if(process.platform!=='win32'||process.arch!=='x64'||process.version!=='v24.19.0')throw Error('Runtime mismatch')"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime verification failed' }
          $privateFiles = @(git ls-files | Where-Object { $_ -match '^(storage/|work/|public/local-videos/|\.env)' })
          if ($privateFiles.Count) { throw 'Private runtime files must never enter a remote build' }
      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify bounded transcription and Windows temporary paths without a model
        run: python scripts/test-transcribe-windows.py
      - name: Verify renderer timed-caption alignment without provider or model imports
        run: python scripts/test-renderer-timed-captions.py
      - name: Verify news renderer refuses unapproved supplemental stock without models or providers
        run: python -B scripts/test-renderer-news-policy.py
      - name: Verify subtitle placement uses the actual decoded picture size
        run: python -B scripts/test-renderer-subtitle-canvas.py
      - name: Run release regressions one file at a time
        # UI fixture compilation needs more heap than the application data tests.
        run: >-
          node --max-old-space-size=384 --test --test-concurrency=1
          scripts/test-package-phoenix-build.cjs
          scripts/test-install-phoenix-build.cjs
          scripts/test-project-cleanup.cjs
          scripts/test-buyer-regressions.cjs
          scripts/test-local-mutation-boundaries.cjs
          scripts/test-file-lock.cjs
          scripts/test-runtime-lazy-loading.cjs
          scripts/test-workflow-admission.cjs
          scripts/test-editor-controls.cjs
          scripts/test-channel-connections-ui.cjs
          scripts/test-creative-brief.cjs
          scripts/test-encoder-benchmark.cjs
          scripts/test-instagram-hashtag-activity.cjs
          scripts/test-instagram-story-ideas.cjs
          scripts/test-kids-speech-timing.cjs
          scripts/test-local-model-session.cjs
          scripts/test-narration-timing.cjs
          scripts/test-natural-stock.cjs
          scripts/test-posting-provenance.cjs
          scripts/test-review-library-stock.cjs
          scripts/test-review-library.cjs
          scripts/test-review-poster-resources.cjs
          scripts/test-review-poster-ui.cjs
          scripts/test-review-storage.cjs
          scripts/test-stock-proxy.cjs
          scripts/test-worker-startup.cjs
          scripts/test-review-publishing.cjs
          scripts/test-review-publish-ui.cjs
          scripts/test-review-publication-summary.cjs
          scripts/test-instagram-location-suggestions.cjs
          scripts/test-video-posting-analysis.cjs
          scripts/test-posting-copy-policy.cjs
          scripts/test-reel-music.cjs
          scripts/test-instagram-audio.cjs
          scripts/test-instagram-tags.cjs
          scripts/test-channel-connections.cjs
          scripts/test-instagram-performance.cjs
          scripts/test-instagram-performance-learning.cjs
          scripts/test-instagram-performance-ui.cjs
          scripts/test-instagram-performance-boundaries.cjs
          scripts/test-instagram-learning-guidance.cjs
          scripts/test-instagram-topic-suggestions.cjs
          scripts/test-posting-automation.cjs
          scripts/test-posting-actions.cjs
          scripts/test-publish-settings-status.cjs
          scripts/test-stock-reels-ui.cjs
          scripts/test-stock-footage-suggestions-ui.cjs
          scripts/test-recommended-ideas-ui.cjs
          scripts/test-recommendation-memory.cjs
          scripts/test-stock-production-guidance.cjs
          scripts/test-quality-manager.cjs
          scripts/test-quality-manager-ui.cjs
          scripts/test-release-refresh.cjs
          scripts/test-launch-release-consistency.cjs
          scripts/test-restart-rebuild.cjs
          scripts/test-cloudflare-writer.cjs
          scripts/test-writing-rotation.cjs
          scripts/test-cloudflare-vision.cjs
          scripts/test-draft-planning-admission.cjs
          scripts/test-stock-storyboard.cjs
          scripts/test-unavailable-stock-queries.cjs
          scripts/test-creation-drafts.cjs
          scripts/test-news-research.cjs
          scripts/test-news-visuals.cjs
          scripts/test-service-health.cjs
          scripts/test-stock-editorial.cjs
          scripts/test-stock-playback.cjs
          scripts/test-review-workflows.cjs
          scripts/test-worker-workflows.cjs
          scripts/test-queue-history.cjs
          scripts/test-model-queue-waits.cjs
          scripts/test-render-resources.cjs
          scripts/test-local-model-resources.cjs
          scripts/test-dashboard-monitor.cjs
          scripts/test-dashboard-preview-refresh.cjs
          scripts/test-dashboard-job-views.cjs
          scripts/test-preparation-retry-ui.cjs
          scripts/test-studio-navigation.cjs
          scripts/test-source-processor-resources.cjs
          scripts/test-source-status-polling.cjs
          scripts/test-kids-writing-direction.cjs
          scripts/test-kids-story-quality.cjs
          scripts/test-expressive-animation.cjs
          scripts/test-animation-and-delete.cjs
          scripts/test-writing-settings.cjs
          scripts/test-writing-settings-ui.cjs
          scripts/test-posting-snapshot-order.cjs
          scripts/test-groq-writer.cjs
          scripts/test-startup.cjs
          scripts/test-desktop-session.cjs
          scripts/test-automatic-stock-reel.cjs
          scripts/test-automatic-stock-pool.cjs
          scripts/test-stock-catalog-paging.cjs
          scripts/test-natural-stock-relevance.cjs
          scripts/test-open-stock-catalog.cjs
          scripts/test-stock-provider-integration.cjs
          scripts/test-stock-footage-import-ui.cjs
          scripts/test-stock-reel-adaptive.cjs
          scripts/test-stock-motion.cjs
          scripts/test-stock-reuse.cjs
