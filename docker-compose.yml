services:
  auraclip:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      FREE_LOCAL_ONLY: "1"
      GEMINI_API_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      S3_ENDPOINT: ""
      S3_BUCKET_NAME: ""
      LUMINA_LLM_API_KEY: ""
    restart: unless-stopped
